<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Тема декабря — голосование</title>
  <style>
    @font-face {
      font-family: "Benzin";
      src: url("https://twiglles.github.io/kinoshnaya/benzin-semibold.woff") format("woff");
      font-weight: 600;
      font-display: swap;
    }
    :root {
      --bg: #000; --text: #fff; --muted: rgba(255,255,255,.58);
      --line: rgba(255,255,255,.14); --surface: rgba(255,255,255,.05); --surface-2: rgba(255,255,255,.1);
      --accent: #890c0c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); color-scheme: dark; }
    body {
      font: 15px/1.45 Montserrat, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    }
    main { max-width: 520px; margin: 0 auto; }
    .brand {
      display: inline-block; padding: 7px 11px; border-radius: 6px; background: var(--accent);
      font: 600 12px/1 Benzin, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font: 600 30px/1.1 Benzin, sans-serif; text-transform: uppercase; }
    .lead { margin: 0 0 22px; color: var(--muted); }

    .opts { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .opt {
      position: relative; overflow: hidden; width: 100%;
      display: flex; align-items: center; gap: 14px; padding: 16px;
      border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
      color: inherit; font: inherit; text-align: left; cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .opt:active { transform: scale(.985); }
    @media (hover: hover) { .opt:hover { background: var(--surface-2); } }
    .opt:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .bar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(137,12,12,.35);
      transition: width .4s ease; pointer-events: none;
    }
    .opt.on { border-color: var(--accent); }
    .check {
      position: relative; flex: none; width: 26px; height: 26px; border-radius: 8px;
      border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; line-height: 1;
      transition: background .15s, border-color .15s;
    }
    .opt.on .check { background: var(--accent); border-color: var(--accent); }
    .opt.on .check::after { content: "✓"; color: #fff; font-weight: 700; }
    .name { position: relative; flex: 1; font: 600 13px/1.3 Benzin, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
    .count { position: relative; flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .opt.lead-opt .count { color: var(--text); }

    .status { margin: 18px 0 0; min-height: 20px; color: var(--muted); font-size: 13px; text-align: center; }
    .status.err { color: #ff8a8a; }
    .status button {
      margin-left: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: inherit; font: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <span class="brand">Twiglles Киношная</span>
    <h1>Тема декабря</h1>
    <p class="lead">Выберите все темы, которые хотите смотреть: можно несколько. Нажмите ещё раз, чтобы снять голос.</p>
    <ul class="opts" id="opts"></ul>
    <p class="status" id="status" role="status" aria-live="polite">Загружаем…</p>
  </main>

  <script>
    (function () {
      var DB = "https://twiglles-kinoshnaya-default-rtdb.europe-west1.firebasedatabase.app";
      var POLL = "theme-2026-12"; // чтобы начать новое голосование, поменяйте название
      var OPTIONS = [
        { id: "silent", title: "Немое кино" },
        { id: "asian", title: "Азиатское кино" },
        { id: "ny-pop", title: "Новогоднее популярное кино" },
        { id: "ny-niche", title: "Новогоднее нишевое кино" },
        { id: "space", title: "Космос" },
        { id: "no-happy-end", title: "Фильмы без хэппи-энда" }
      ];

      function store(k, v) {
        try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
      }
      // Тот же анонимный номер, что и на сайте голосования: один браузер = один участник
      var voter = store("kino.voter");
      if (!voter) {
        voter = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/-/g, "");
        store("kino.voter", voter);
      }

      var votes = {};      // id -> { voterId: true }
      var loaded = false;
      var pending = {};    // id -> true пока идёт запись
      var listEl = document.getElementById("opts");
      var statusEl = document.getElementById("status");

      function url(path) { return DB + "/polls/" + POLL + "/votes" + path + ".json"; }
      function setStatus(text, err, retry) {
        statusEl.className = "status" + (err ? " err" : "");
        statusEl.textContent = text;
        if (retry) {
          var b = document.createElement("button");
          b.type = "button"; b.textContent = "Повторить";
          b.onclick = function () { setStatus("Загружаем…"); load(); };
          statusEl.appendChild(b);
        }
      }

      function counts() {
        var c = {}, voters = {};
        OPTIONS.forEach(function (o) {
          var m = votes[o.id] || {};
          c[o.id] = Object.keys(m).length;
          Object.keys(m).forEach(function (v) { voters[v] = 1; });
        });
        return { c: c, people: Object.keys(voters).length };
      }

      function render() {
        var s = counts();
        var max = Math.max.apply(null, OPTIONS.map(function (o) { return s.c[o.id]; }));
        listEl.innerHTML = "";
        OPTIONS.forEach(function (o) {
          var on = !!(votes[o.id] && votes[o.id][voter]);
          var n = s.c[o.id];
          var li = document.createElement("li");
          var b = document.createElement("button");
          b.type = "button";
          b.className = "opt" + (on ? " on" : "") + (max > 0 && n === max ? " lead-opt" : "");
          b.setAttribute("role", "checkbox");
          b.setAttribute("aria-checked", on ? "true" : "false");
          b.innerHTML = '<span class="bar"></span><span class="check"></span><span class="name"></span><span class="count"></span>';
          b.querySelector(".name").textContent = o.title;
          b.querySelector(".count").textContent = loaded ? n : "";
          b.querySelector(".bar").style.width = (s.people ? Math.round(n / s.people * 100) : 0) + "%";
          b.onclick = function () { toggle(o.id); };
          li.appendChild(b);
          listEl.appendChild(li);
        });
        if (loaded) {
          var w = s.people % 10 === 1 && s.people % 100 !== 11 ? "человек" : (s.people % 10 >= 2 && s.people % 10 <= 4 && (s.people % 100 < 12 || s.people % 100 > 14) ? "человека" : "человек");
          setStatus(s.people ? "Проголосовали: " + s.people + " " + w : "Пока никто не проголосовал. Будьте первым!");
        }
      }

      function load() {
        return fetch(url(""), { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function (d) {
            var next = d || {};
            // свои несохранённые правки не затираем
            Object.keys(pending).forEach(function (id) { next[id] = votes[id]; });
            votes = next; loaded = true; render();
          })
          .catch(function () {
            if (!loaded) { render(); setStatus("Не получилось загрузить голоса. Проверьте интернет.", true, true); }
          });
      }

      function toggle(id) {
        if (!loaded || pending[id]) return;
        var had = !!(votes[id] && votes[id][voter]);
        votes[id] = votes[id] || {};
        if (had) delete votes[id][voter]; else votes[id][voter] = true;
        pending[id] = true;
        render();
        fetch(url("/" + id + "/" + voter), { method: had ? "DELETE" : "PUT", body: had ? null : "true" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); })
          .catch(function () {
            // не получилось сохранить — возвращаем как было и честно говорим
            if (had) votes[id][voter] = true; else delete votes[id][voter];
            setStatus("Голос не сохранился. Попробуйте ещё раз.", true);
          })
          .then(function () { delete pending[id]; render(); });
      }

      render();
      load();
      setInterval(function () { if (!document.hidden) load(); }, 5000);
    })();
  </script>
</body>
</html>
